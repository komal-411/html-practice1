<!DOCTYPE html>
<html>
    <head>
        <title>SVG ellipse</title>
        <style type="text/css">
            svg{ border:2px solid black;}
        </style>
        
    </head>
    <body>
     
        <svg height="400" width="400">        
        <line x1="50px" y1="300" x2="200" y2="100" stroke="red" stroke-width="2px"/>        
        <line x1="200px" y1="100" x2="350" y2="300" stroke="blue" stroke-width="2px"/>        
        <line x1="350px" y1="300" x2="50" y2="300" stroke="green" stroke-width="2px"/>        
        
         </svg><br><br>
         
         
        <svg height="400" width="400">
        
        <line x1="50px" y1="300" x2="50" y2="100" stroke="red" stroke-width="2px"/>        
        <line x1="50px" y1="100" x2="300" y2="300" stroke="blue" stroke-width="2px"/>        
        <line x1="300px" y1="300" x2="50" y2="300" stroke="green" stroke-width="2px"/>        
        
            </svg><br><br>
        
    <svg height="400" width="400">
        
        <line x1="50px" y1="100" x2="350" y2="100" stroke="red" stroke-width="2px"/>        
        <line x1="350px" y1="100" x2="200" y2="300" stroke="blue" stroke-width="2px"/>        
        <line x1="200px" y1="300" x2="50" y2="100" stroke="green" stroke-width="2px"/>        
        
            </svg>
    
    
    
    
    </body>
</html>
