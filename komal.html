<!doctype html>

    <body>
        <form>
            <fieldset>
                <h2>Student Registration form</h2>
                Roll no.: <input type="text" placeholder="Enter your roll no."><br>
                Student name: <input type="text" placeholder="Enter your name"><br>
                Father's name: <input type="text" placeholder="Enter name"><br>
                Date of Birth: <input type="text" placeholder="Day"> - <input type="text" placeholder="Month"> - <input type="text" placeholder="Year">(DD-MM-YYYY)<br>
                Moblile no.: <input type="text" placeholder="Number"><br>
                Email ID: <input type="text" placeholder="Enter your email id"><br>
                Password: <input type="text" placeholder="Email id password"><br>
                Gender: <input type="radio" name="a">Male<input type="radio" name="a">Female<input type="radio" name="a">Other<br>
                Department: <input type="checkbox">CSE
                            <input type="checkbox">IT
                            <input type="checkbox">ECE
                            <input type="checkbox">Cvil
                            <input type="checkbox">Mech<br>
                Course: 
                <select> 
                    <option>------Select Current course------</option>
                    <option>B.Com</option>
                    <option>BBA</option>
                    <option>BCA</option>
                    <option>Bsc</option>
                </select><br>
                Student photo: <input type="file" placeholder="choose file"><br>
                City: <select>
                <option>----city----</option>
                <option>Haryana</option>
                <option>Delhi</option>
                <option>Bihar</option>
                <option>Kolkata</option>
                <option>Mumbai</option>
                <option>Jharkhand</option>
                     </select><br>
                Address: <input type="text" placeholder="Address" style="height:60px"><br>
                <button>Register</button>
            </fieldset>
        </form>
    </body>
</html>
